- title: "STAMP"
  meta: "Sep 2024 · Python · KatherLab Team"
  desc: "An open-source computational pathology pipeline from the KatherLab team for discovering and evaluating image-based biomarkers from gigapixel histopathology slides without pixel-level annotations. The peer-reviewed workflow helps clinical researchers and ML engineers run reproducible studies across multiple tumor types."
  image: "assets/thumbnails/STAMP_logo.svg"
  alt: "STAMP logo"
  href: "https://github.com/KatherLab/STAMP"
  thumb_class: "project-thumb--logo"
  links:
